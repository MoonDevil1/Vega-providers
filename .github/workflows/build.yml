name: Validate Vega provider bundles

on:
  pull_request:
    paths:
      - "providers/**"
      - "manifest.json"
      - "build-bundled.js"
      - "package.json"
      - "package-lock.json"
      - "tests/test-multi.js"
      - "tests/test-multi-stream.js"
      - "tests/test-multi-catalog.js"
      - ".github/workflows/build.yml"
  push:
    branches:
      - main
    paths:
      - "providers/**"
      - "manifest.json"
      - "build-bundled.js"
      - "package.json"
      - "package-lock.json"
      - "tests/test-multi.js"
      - "tests/test-multi-stream.js"
      - "tests/test-multi-catalog.js"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build all provider bundles
        run: npm run build
      - name: Verify required bundle outputs
        run: |
          test -s dist/multi/posts.js
          test -s dist/multi/meta.js
          test -s dist/multi/stream.js
          test -s dist/multi/episodes.js
          test -s dist/multi/catalog.js
      - name: Run MultiMovies episode regression tests
        run: node tests/test-multi.js
      - name: Run MultiMovies stream regression tests
        run: node tests/test-multi-stream.js
      - name: Run MultiMovies catalog regression tests
        run: node tests/test-multi-catalog.js
      - name: Validate generated JavaScript syntax
        run: |
          for file in dist/multi/catalog.js dist/multi/posts.js dist/multi/meta.js dist/multi/episodes.js dist/multi/stream.js; do
            node --check "$file"
          done
