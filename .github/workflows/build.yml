name: Validate Vega provider bundles

on:
  push:
    branches:
      - main
    paths:
      - "providers/**"
      - "manifest.json"
      - "build-bundled.js"
      - "package.json"
      - "package-lock.json"
      - "tests/test-multi.js"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build all provider bundles
        run: npm run build
      - name: Verify required bundle outputs
        run: |
          test -s dist/multi/posts.js
          test -s dist/multi/meta.js
          test -s dist/multi/stream.js
          test -s dist/multi/episodes.js
          test -s dist/multi/catalog.js
          test -s dist/multi2/posts.js
          test -s dist/multi2/meta.js
          test -s dist/multi2/stream.js
          test -s dist/multi2/episodes.js
          test -s dist/multi2/catalog.js
      - name: Run MultiMovies regression tests
        run: node tests/test-multi.js
      - name: Commit generated provider bundles
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git diff --cached --quiet; then
            echo "No generated bundle changes"
          else
            git commit -m "Build provider bundles"
            git push
          fi
