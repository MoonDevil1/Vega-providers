name: Build Vega provider bundles

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Avoid concurrent pushes when several provider files are updated in quick succession.
concurrency:
  group: vega-provider-build-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build provider bundles
        run: npm run build
      - name: Test Hindi IPTV provider
        run: node tests/test-iptv.js
      - name: Test MultiMovies episode stream extraction
        run: node tests/test-multi-stream.js
      - name: Commit generated bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "Generated bundles are already up to date."
          else
            git commit -m "Build Vega provider bundles"
            git push origin HEAD:main
          fi
